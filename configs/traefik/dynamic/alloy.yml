###############################################################################
#
# Infrastructure-netcup Project
#
# File:
#   configs/traefik/dynamic/alloy.yml
#
# Description:
#   Grafana Alloy router and service.
#
# Access:
#
#   WireGuard client
#       ↓
#   Traefik :8448
#       ↓
#   BasicAuth + IP whitelist
#       ↓
#   Monitoring-netcup 10.10.10.11:12345
#
###############################################################################

http:

  ###########################################################################
  # Routers
  ###########################################################################

  routers:

    #########################################################################
    # Alloy
    #########################################################################

    alloy:

      entryPoints:

        - alloy

      #
      # Dedicated port -- no subpath.
      #
      #   https://10.10.10.10:8448/
      #
      # Access is restricted by default-chain:
      #
      #   IP whitelist
      #   security headers
      #   compression
      #   BasicAuth
      #

      rule: PathPrefix(`/`)

      service: alloy

      middlewares:

        - default-chain

      tls:

        options: default

      priority: 1

  ###########################################################################
  # Services
  ###########################################################################

  services:

    ###########################################################################
    # Alloy
    ###########################################################################

    alloy:

      loadBalancer:

        passHostHeader: true

        servers:

          - url: http://10.10.10.11:12345