###############################################################################
#
# Infrastructure-netcup Project
#
# File:
#   configs/traefik/dynamic/homeassistant-domapc.yml
#
# Description:
#   Central Traefik route to Home Assistant running on domaPc
#   behind WireGuard wg2.
#
# Backend:
#
#   Home Assistant
#   Host:  domaPc
#   IP:    10.110.100.100
#   Port:  8123
#
#   Traffic path:
#
#     VPS Traefik
#       -> WireGuard wg2
#       -> domaPc (10.110.100.100)
#       -> MikroTik DNAT
#       -> Incus container LAN IP
#       -> Home Assistant Docker service
#
# Public hostname:
#
#   homeassistant.serveftp.org
#
# Authentication:
#
#   Home Assistant keeps its own login.
#   This router does not use Authentik ForwardAuth.
#
#   Home Assistant has its own authentication system,
#   REST API, WebSocket API and long-lived access tokens.
#   The official mobile application and other clients
#   must be able to communicate directly with Home Assistant.
#
#   Authentik ForwardAuth would interfere with clients
#   that do not have an Authentik browser session.
#
# Headers:
#
#   public-chain is not used.
#   homeassistant-chain keeps CrowdSec, rate limiting
#   and compression from the shared public protection model.
#
#   The dedicated homeassistant-headers middleware follows
#   the same header policy as nextcloud-headers.
#
#   Not set, on purpose:
#
#     frameDeny
#     Content-Security-Policy
#     X-Frame-Options
#     Cross-Origin-Opener-Policy
#     Cross-Origin-Resource-Policy
#
#   These headers are deliberately omitted to avoid
#   interfering with Home Assistant frontend functionality
#   and integrations.
#
###############################################################################

http:
  ###########################################################################
  # Router
  ###########################################################################

  routers:
    homeassistant-domapc:
      entryPoints:
        - websecure

      rule: "Host(`homeassistant.serveftp.org`)"

      service: homeassistant-domapc

      middlewares:
        - homeassistant-chain

      tls:
        certResolver: letsencrypt

  ###########################################################################
  # Service
  ###########################################################################

  services:
    homeassistant-domapc:
      loadBalancer:
        passHostHeader: true

        servers:
          - url: "http://10.110.100.100:8123"

  ###########################################################################
  # Middleware
  ###########################################################################

  middlewares:
    #########################################################################
    # Chain
    #########################################################################

    homeassistant-chain:
      chain:
        middlewares:
          #
          # Headers compatible with Home Assistant.
          #
          - homeassistant-headers

          #
          # CrowdSec protection.
          #
          - crowdsec

          #
          # Shared request rate limit.
          #
          - rate-limit

          #
          # Enable response compression.
          #
          - compress

    #########################################################################
    # Headers
    #########################################################################

    homeassistant-headers:
      headers:
        #
        # Prevent MIME type sniffing.
        #
        contentTypeNosniff: true

        #
        # Enable basic XSS protection for older browsers.
        #
        browserXssFilter: true

        #
        # Same referrer policy as nextcloud-headers.
        #
        referrerPolicy: "strict-origin-when-cross-origin"

        #
        # Force HTTPS for one year, including subdomains.
        #
        stsSeconds: 31536000

        stsIncludeSubdomains: true

        stsPreload: true

        #
        # Treat X-Forwarded-Proto: https as HTTPS.
        #
        sslProxyHeaders:
          X-Forwarded-Proto: https

        #
        # Same Permissions-Policy as nextcloud-headers.
        #
        permissionsPolicy: >-
          accelerometer=(),
          geolocation=(),
          gyroscope=(),
          magnetometer=(),
          payment=(),
          usb=(),
          interest-cohort=()

        customResponseHeaders:
          X-Robots-Tag: "noindex,nofollow"

          Server: ""

          X-Permitted-Cross-Domain-Policies: "none"
