###############################################################################
#
# Infrastructure-netcup Project
#
# File:
#   configs/traefik/dynamic/prometheus.yml
#
# Description:
#   Prometheus router and service.
#
# Access:
#
#   WireGuard client
#       ↓
#   Traefik :8445
#       ↓
#   BasicAuth + IP whitelist
#       ↓
#   Monitoring-netcup 10.10.10.11:9090
#
###############################################################################

http:

  ###########################################################################
  # Routers
  ###########################################################################

  routers:

    #########################################################################
    # Prometheus
    #########################################################################

    prometheus:

      entryPoints:

        - prometheus

      #
      # Dedicated port -- no subpath.
      #
      #   https://10.10.10.10:8445/
      #
      # Access is restricted by default-chain:
      #
      #   ip-whitelist
      #   security headers
      #   compression
      #   BasicAuth
      #

      rule: PathPrefix(`/`)

      service: prometheus

      middlewares:

        - default-chain

      tls:

        options: default

      priority: 1

  ###########################################################################
  # Services
  ###########################################################################

  services:

    #########################################################################
    # Prometheus
    #########################################################################

    prometheus:

      loadBalancer:

        passHostHeader: true

        servers:

          - url: http://10.10.10.11:9090